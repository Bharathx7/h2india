# Local services for development (playbook step 1.3). Start with: pnpm dev:up
# Values come from .env.local (copy .env.example first). Nothing here is used in production.
name: h2india

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.local}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env.local}", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  meilisearch:
    image: getmeili/meilisearch:v1.56
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env.local}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports: ["127.0.0.1:${MEILI_PORT:-7700}:7700"]
    volumes: [meilidata:/meili_data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || wget -qO- http://localhost:7700/health"]
      interval: 5s
      retries: 20

  # S3-compatible file storage. MinIO no longer publishes free official images; this build is the one hy-gen used.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env.local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env.local}
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@localhost:9000
    ports: ["127.0.0.1:${S3_PORT:-9000}:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Creates the two buckets once: private (documents, datasheets) with anonymous access off, public (images).
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
      PRIVATE: ${S3_BUCKET_PRIVATE:?set in .env.local}
      PUBLIC: ${S3_BUCKET_PUBLIC:?set in .env.local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc mb --ignore-existing local/$${PRIVATE} && mc anonymous set none local/$${PRIVATE} && mc mb --ignore-existing local/$${PUBLIC}
    restart: "no"

  # Catches every outgoing email so nothing reaches a real inbox. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${SMTP_PORT:-1025}:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
