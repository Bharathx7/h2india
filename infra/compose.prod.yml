# Production on the existing server (step 1.7, ADR 0006, docs/server.md). Run from /srv/h2india with:
#   docker compose -f compose.prod.yml --env-file h2india.env <command>
# Only the host's nginx reaches the apps and file storage, on 127.0.0.1. Databases have no published ports.
# Settings live in h2india.env on the server (permissions 600), never in git: see infra/h2india.env.example.
name: h2india

x-app: &app
  image: ${IMAGE:?set IMAGE in h2india.env}
  env_file: [h2india.env]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    meilisearch: { condition: service_healthy }
  # Step 13.3: container logs go to the host's journal, which keeps them for 180 days (CERT-In Directions 2022;
  # infra/logging/journald.conf). `docker compose logs` still works. Each line carries the container name as its tag.
  logging: &logging
    driver: journald
    options: { tag: "h2india/{{.Name}}" }

services:
  # The website, workspaces and APIs.
  web-public:
    <<: *app
    environment:
      APP_URL: ${PUBLIC_URL:?set PUBLIC_URL}
    ports: ["127.0.0.1:${PUBLIC_PORT:-3210}:3000"]

  # The admin and the CMS. Same image; its own APP_URL so sign-in, passkeys and Payload use the admin domain.
  # Search indexing is always off here.
  web-admin:
    <<: *app
    environment:
      APP_URL: ${ADMIN_URL:?set ADMIN_URL}
      FLAG_SEARCH_INDEXING: "false"
    ports: ["127.0.0.1:${ADMIN_PORT:-3211}:3000"]

  worker:
    <<: *app
    # Runs from source with tsx, as in development: the esbuild bundle (dist) leaves the shared packages' own
    # dependencies (meilisearch and others) unresolvable from apps/worker under pnpm's strict node_modules.
    command: ["pnpm", "--filter", "@h2india/worker", "exec", "tsx", "src/index.ts"]
    environment:
      APP_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      INTERNAL_WEB_URL: http://web-public:3000

  # One-off commands: docker compose ... run --rm tools pnpm db:migrate
  tools:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command: ["node", "-e", "console.log('tools: pass a command')"]
    environment:
      APP_URL: ${PUBLIC_URL:?set PUBLIC_URL}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in h2india.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in h2india.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in h2india.env}
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in h2india.env}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      retries: 20
    logging: *logging

  meilisearch:
    image: getmeili/meilisearch:v1.56
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in h2india.env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes: [meilidata:/meili_data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || wget -qO- http://localhost:7700/health"]
      interval: 10s
      retries: 20
    logging: *logging

  # File storage, served to browsers on the public domain under the bucket names through nginx.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in h2india.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in h2india.env}
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@localhost:9000
    ports: ["127.0.0.1:${FILES_PORT:-3212}:9000"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 20
    logging: *logging

  # Creates the buckets once, with the same rules as local development.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["tools"]
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
      PRIVATE: ${S3_BUCKET_PRIVATE:?set in h2india.env}
      PUBLIC: ${S3_BUCKET_PUBLIC:?set in h2india.env}
      QUARANTINE: ${S3_BUCKET_QUARANTINE:-h2india-quarantine}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc mb --ignore-existing local/$${PRIVATE} local/$${PUBLIC} local/$${QUARANTINE} && mc anonymous set none local/$${PRIVATE} && mc anonymous set none local/$${QUARANTINE} && mc anonymous set download local/$${PUBLIC}
    restart: "no"

  # Virus scanner for uploads. Needs about 1.5 GB of memory; the first start downloads signatures (a few minutes).
  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    volumes: [clamdata:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      start_period: 10m
      retries: 10
    logging: *logging

  # Until the email provider is chosen (M6), outgoing email is caught here and never delivered. Open its inbox only
  # through an SSH tunnel: ssh -L 8025:127.0.0.1:8025 <server>, then http://localhost:8025. Remove when M6 is set.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    logging: *logging

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  clamdata:
