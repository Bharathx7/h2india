# Step 13.3: keep logs at least 180 days (CERT-In Directions, 28 April 2022). Copy to
# /etc/systemd/journald.conf.d/h2india.conf on the server, then: sudo systemctl restart systemd-journald
# The size cap is a safety net; check `journalctl --disk-usage` monthly and raise it before it bites, because when the
# cap is reached the oldest logs go first, before 180 days.
[Journal]
Storage=persistent
MaxRetentionSec=200day
SystemMaxUse=20G
SystemKeepFree=5G
Compress=yes
