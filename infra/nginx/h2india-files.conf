# Shared settings for the file bucket locations. Copy to /etc/nginx/snippets/h2india-files.conf.
# Signed links include the host and path, so MinIO must see exactly what the browser sent.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_request_buffering off;
client_max_body_size 100m;  # the real limit per kind is part of each signed upload link
# A location with its own add_header drops the server's, so repeat them here.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
