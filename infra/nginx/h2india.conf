# Host nginx for H2 India (step 1.7, docs/server.md). Domains since 16 Nov 2026 (M1): h2economy.co and
# admin.h2economy.co; www.h2economy.co redirects to h2economy.co. The old deecodes.io names are switched off
# (founder): no block serves them. Copy to /etc/nginx/sites-available/h2india.conf, link it into
# sites-enabled, then run certbot --nginx for both names; certbot adds the HTTPS parts to these blocks.
#
#   h2economy.co        website, workspaces and APIs   -> web-public (127.0.0.1:3210)
#                              /h2india-*/ file buckets        -> minio      (127.0.0.1:3212)
#   admin.h2economy.co   admin and CMS only              -> web-admin  (127.0.0.1:3211)
#
# Every app request gets the visitor's address in X-Real-IP (AUTH_IP_HEADER), overwritten here so it can't be faked.
#
# Files: there are only two domains (founder, 13 Nov 2026), so storage is served from the public domain under the
# bucket names, path unchanged (signed links include the path and host). Uploaded files must never act as pages of
# the site: every file response gets nosniff and a CSP that blocks scripts; images and quarantine are fully sandboxed.
# If the bucket names in h2india.env change, change them here too.

map $http_upgrade $h2india_connection { default upgrade; "" ""; }

# ---------- www: one address for the site ----------
server {
    listen 80;
    listen [::]:80;
    server_name www.h2economy.co;
    location / { return 301 https://h2economy.co$request_uri; }
}

# ---------- Public site and files ----------
server {
    listen 80;
    listen [::]:80;
    server_name h2economy.co;

    client_max_body_size 2m;  # forms are small; files go to the bucket locations below
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Scheduled work is called by the worker inside Docker, never from outside.
    location ^~ /api/internal/ { return 404; }
    # The admin and CMS live on the admin domain only.
    location ~ ^/(admin|cms|cms-preview)(/|$) { return 301 https://admin.h2economy.co$request_uri; }
    location ^~ /api/cms { return 404; }

    # Checked public images and unchecked uploads: never scripts, never framed, fully sandboxed.
    location ~ ^/(h2india-public|h2india-quarantine)/ {
        proxy_pass http://127.0.0.1:3212;
        include /etc/nginx/snippets/h2india-files.conf;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }
    # Private documents (opened only by 5-minute signed links). No sandbox, so the browser's PDF viewer works.
    location ^~ /h2india-private/ {
        proxy_pass http://127.0.0.1:3212;
        include /etc/nginx/snippets/h2india-files.conf;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; object-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        include /etc/nginx/snippets/h2india-proxy.conf;
    }
}

# ---------- Admin ----------
server {
    listen 80;
    listen [::]:80;
    server_name admin.h2economy.co;

    client_max_body_size 100m;  # CMS media and report PDFs
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { return 302 /admin; }
    location ^~ /api/internal/ { return 404; }

    # Only the admin, CMS, sign-in and what they load. Everything else belongs to the public site.
    location ~ ^/(admin|cms|cms-preview|api|sign-in|sign-out|forgot-access|account|notifications|_next|brand)(/|$) {
        proxy_pass http://127.0.0.1:3211;
        include /etc/nginx/snippets/h2india-proxy.conf;
    }
    location ~ ^/(favicon\.ico|icon|apple-icon) {
        proxy_pass http://127.0.0.1:3211;
        include /etc/nginx/snippets/h2india-proxy.conf;
    }
    location / { return 301 https://h2economy.co$request_uri; }
}
