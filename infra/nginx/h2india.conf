# Host nginx for H2 India (step 1.7, docs/server.md). Copy to /etc/nginx/sites-available/h2india.conf, link it into
# sites-enabled, then run certbot --nginx for the three names; certbot adds the HTTPS parts to these blocks.
#
#   h2india.deecodes.io        website, workspaces and APIs   -> web-public (127.0.0.1:3100)
#   adminh2india.deecodes.io   admin and CMS only              -> web-admin  (127.0.0.1:3101)
#   files.h2india.deecodes.io  uploads and public images       -> minio      (127.0.0.1:3102)
#
# Every app request gets the visitor's address in X-Real-IP (AUTH_IP_HEADER), overwritten here so it can't be faked.

map $http_upgrade $h2india_connection { default upgrade; "" ""; }

# ---------- Public site ----------
server {
    listen 80;
    listen [::]:80;
    server_name h2india.deecodes.io;

    client_max_body_size 2m;  # files go straight to files.*; forms are small
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Scheduled work is called by the worker inside Docker, never from outside.
    location ^~ /api/internal/ { return 404; }
    # The admin and CMS live on the admin domain only.
    location ~ ^/(admin|cms|cms-preview)(/|$) { return 301 https://adminh2india.deecodes.io$request_uri; }
    location ^~ /api/cms { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/h2india-proxy.conf;
    }
}

# ---------- Admin ----------
server {
    listen 80;
    listen [::]:80;
    server_name adminh2india.deecodes.io;

    client_max_body_size 100m;  # CMS media and report PDFs
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { return 302 /admin; }
    location ^~ /api/internal/ { return 404; }

    # Only the admin, CMS, sign-in and what they load. Everything else belongs to the public site.
    location ~ ^/(admin|cms|cms-preview|api|sign-in|sign-out|forgot-access|account|notifications|_next|brand)(/|$) {
        proxy_pass http://127.0.0.1:3101;
        include /etc/nginx/snippets/h2india-proxy.conf;
    }
    location ~ ^/(favicon\.ico|icon|apple-icon)  {
        proxy_pass http://127.0.0.1:3101;
        include /etc/nginx/snippets/h2india-proxy.conf;
    }
    location / { return 301 https://h2india.deecodes.io$request_uri; }
}

# ---------- Files ----------
server {
    listen 80;
    listen [::]:80;
    server_name files.h2india.deecodes.io;

    client_max_body_size 100m;  # the real limit per kind is part of each signed upload link
    proxy_request_buffering off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # MinIO's own admin and metrics paths stay private.
    location ^~ /minio/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3102;
        # Signed links include the host, so MinIO must see the same one the browser used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
