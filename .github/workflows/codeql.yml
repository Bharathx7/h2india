# Step 12.1: static analysis of the TypeScript on every change and weekly (new rules arrive between changes).
# Results appear under Security → Code scanning; a high-severity alert on a pull request fails this check.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 1 * * 1" # Mondays 07:00 IST

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - "**/*.test.ts"
              - "**/*.int.test.ts"
              - tests/e2e
              - "**/migrations/**"
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
