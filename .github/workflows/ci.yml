# Playbook step 1.5: every pull request and every push to main is checked the same way.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Check, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real PostgreSQL and Redis for integration tests (step 3.1), Mailpit for emails (step 3.2). Throwaway credentials, CI only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: h2india
          POSTGRES_PASSWORD: change-me-postgres
          POSTGRES_DB: h2india
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U h2india" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # Catches every email the app sends; the sign-in tests read their codes from it (step 3.2).
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://h2india:change-me-postgres@localhost:5432/h2india
      TEST_DATABASE_URL: postgresql://h2india:change-me-postgres@localhost:5432/h2india_test
      REDIS_URL: redis://localhost:6379
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Throwaway values only. CI never holds real secrets.
      - run: cp .env.example .env.local
      - name: Types, lint and format
        run: pnpm check
      - name: Migrations apply cleanly
        run: pnpm db:migrate
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install browser
        run: pnpm --filter @h2india/e2e exec playwright install --with-deps chromium
      - name: Browser smoke tests (1440 and 390)
        run: pnpm e2e
        env:
          E2E_START_SERVER: "1"
          CI: "true"
          # The /dev pages (tokens, component gallery) are checked in CI, as on staging.
          FLAG_DEV_PAGES: "true"
      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --audit-level high
